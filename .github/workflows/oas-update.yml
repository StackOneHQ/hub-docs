name: OAS Update

on:
  workflow_dispatch:
  schedule:
    # Runs at 7:00 AM UTC every day
    - cron: '0 7 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  oas-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run OAS update
        run: npm run oas:update

      - name: Stage changes
        run: |
          # Stage api-reference changes
          git add "**/api-reference/**"
          # Stage docs.json
          git add docs.json
          git status

      - name: Check for changes in api-reference
        id: check_changes
        run: |
          if git diff --cached --quiet; then
            echo "No changes detected in api-reference or docs.json."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in api-reference or docs.json."
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes found:"
            git diff --cached --name-only
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: 'chore: update OAS spec'
          title: 'chore: update OAS specification'
          body: |
            This PR was automatically generated to update the OpenAPI Specification.

            Changes detected in:
            - api-reference directory
            - docs.json
          branch: 'chore/oas-update'
          delete-branch: true
          labels: |
            automated
            api-reference
